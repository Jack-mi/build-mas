[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "codexwright"
version = "0.5.0"
description = "Codex SDK agentic workflow architect and builder with Skill and MCP integration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openai-codex==0.167.0",
  "pydantic>=2.12,<3",
  "jsonschema>=4.26,<5",
  "mcp==2.3.0",
  "tomli>=2,<3; python_version < '3.11'",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codexwright = ["references/*.md", "templates/*.py", "schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests", "examples"]
markers = ["live: real Codex SDK integration requiring an authenticated model"]
